plugins { id 'com.android.application' }
android {
    namespace 'com.tunetech.drumsep'
    compileSdk 34
    defaultConfig {
        applicationId "com.tunetech.drumsep"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "1.4"
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        // Where the converted DrumSep model is downloaded from (GitHub release "models" of this repo)
        buildConfigField "String", "MODELS_BASE", "\"" + (project.findProperty("modelsBase") ?: "https://github.com/kebedesurafel87-afk/drumsep-android/releases/download/models") + "\""
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        // Permanent key so every update installs over the previous version.
        // Override with env KEYSTORE_FILE / KEYSTORE_PASSWORD for a private key.
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "../keystore/drumsep.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "caaf2b4d49b3ec3c2653fa72c959c279"
            keyAlias "drumsep"
            keyPassword System.getenv("KEYSTORE_PASSWORD") ?: "caaf2b4d49b3ec3c2653fa72c959c279"
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packagingOptions { jniLibs { useLegacyPackaging = false } }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'
}
